<section id="tab-studio" class="view-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
        <div>
            <h2 style="color: var(--primary); font-size: 1.4rem;">Service Entry Studio</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Construct invoices, quotations, or official billing structures dynamically.</p>
        </div>
        <button onclick="commitDocumentToMemory()" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save & Open Preview</button>
    </div>

    <div class="studio-horizontal-meta">
        <div>
            <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Document Reference Code</label>
            <input type="text" id="st-ref-code" placeholder="INV-2026-7002">
        </div>
        <div>
            <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Created Date</label>
            <input type="date" id="st-created-date">
        </div>
        <div>
            <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Company Name</label>
            <input type="text" id="st-company-name" placeholder="Company Name">
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; margin-top: 15px;">
        <h3 style="color: var(--primary); font-size: 1.1rem;">Line Items & Work Breakdown</h3>
        <button onclick="addStudioRow()" class="btn btn-secondary" style="font-size: 0.8rem;">+ Add Line Item</button>
    </div>

    <div class="studio-table-container">
        <table class="studio-table">
            <thead>
                <tr>
                    <th style="width: 50px; text-align: center;">#</th>
                    <th>Description / Work Details</th>
                    <th style="width: 100px; text-align: center;">Qty</th>
                    <th style="width: 150px; text-align: right;">Unit Price (AED)</th>
                    <th style="width: 60px; text-align: center;">Action</th>
                </tr>
            </thead>
            <tbody id="st-spreadsheet-body"></tbody>
        </table>
    </div>
</section>

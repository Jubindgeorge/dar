name: Deploy DAR ERP to Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/executive-dashboard-control-centre
      - feature/accounts-finance-management-centre

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy DAR ERP static assets to Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare public site files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html ledger.html ./*.css dist/
          cp ./*.js dist/
          rm -f dist/translation-route.example.js
          for file in *.png *.PNG *.jpeg *.jpg *.webp; do
            if [[ -f "$file" ]]; then cp "$file" dist/; fi
          done
          test -s dist/index.html
          test -s dist/ledger.html
          test -s dist/config.js
          test -s dist/finance-centre.css

      - name: Deploy preview to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            WORKER_NAME="dar"
          else
            WORKER_NAME="dar-preview"
          fi

          npx --yes wrangler@4 deploy --config wrangler.toml --name "${WORKER_NAME}"
